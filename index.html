<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#377968" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tam Năng" />
    <meta name="description" content="Tam Năng — chăm sóc năng lượng, thời gian và chi tiêu của bạn. Dữ liệu riêng trên thiết bị, dùng được khi ngoại tuyến." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <title>Tam Năng · Chi tiêu có chủ đích</title>
    <script>try{const s=JSON.parse(localStorage.getItem('tam-nang-preferences')||'{}').state;const t=s?.theme||'system';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch{}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
